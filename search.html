<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>城郭検索 | 城郭研究支援GIS</title>

    <style>
    body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    "YuGothic",
    sans-serif;
  background-color: #ffffff;
  color: #222222;
}

.search-page {
  max-width: 760px;
  margin: 0 auto;
  padding: 60px 30px;
}

.search-card {
  text-align: center;
}

.search-title {
  margin: 0 0 20px;
  font-size: 40px;
}

.search-guide {
  margin-bottom: 40px;
  font-size: 17px;
}

#search-form {
  max-width: 520px;
  margin: 0 auto;
}

.form-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  text-align: left;
}

.form-row label {
  font-size: 18px;
  font-weight: bold;
}

.form-row input,
.form-row select {
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  border: 1px solid #aaaaaa;
  border-radius: 7px;
  font-size: 17px;
  background-color: white;
}

.castle-id-note {
  margin: 10px 0 30px 140px;
  font-size: 14px;
  line-height: 1.6;
  text-align: left;
}

.search-button-area {
  margin-top: 35px;
}

.search-button {
  padding: 13px 42px;
  border: 2px solid #333333;
  border-radius: 10px;
  background-color: #bfe7f6;
  color: #222222;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.search-button:hover {
  background-color: #a8dced;
}

.back-button-area {
  margin-top: 50px;
  text-align: center;
}

.back-button-area a {
  color: #0066cc;
  font-size: 16px;
}

@media (max-width: 600px) {
  .search-page {
    padding: 35px 20px;
  }

  .search-title {
    font-size: 30px;
  }

  .form-row {
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .castle-id-note {
    margin-left: 0;
  }
}
    </style>

</head>

<body>

  <main class="search-page">

    <section class="search-card">

      <h1 class="search-title">城郭検索</h1>

      <p class="search-guide">
        わかるところを入力してください。
      </p>

      <form id="search-form">

        <div class="form-row">
          <label for="name">城郭名</label>
          <input type="text" id="name" name="name">
        </div>

        <div class="form-row">
          <label for="location">所在</label>
          <select id="location" name="location">
            <option value="">すべて</option>
          </select>
        </div>

        <div class="form-row">
          <label for="castle-id">城郭番号</label>
          <input type="text" id="castle-id" name="castle-id">
        </div>

        <p class="castle-id-note">
          城郭番号については本会発行の『和歌山城郭研究』24号を御覧下さい。
        </p>

        <div class="search-button-area">
          <button type="submit" class="search-button">
            検索
          </button>
        </div>

      </form>

      <div class="back-button-area">
        <a href="start.html#select">検索の選択にもどる</a>
      </div>

    </section>

  </main>

  <script src="js/search.js"></script>

</body>

</html>
