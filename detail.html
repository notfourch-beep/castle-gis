<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城館詳細 | 城郭研究支援GIS</title>

<style>
  body {
    margin: 0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Hiragino Sans",
      "Yu Gothic",
      "YuGothic",
      sans-serif;
    background-color: #ffffff;
    color: #222222;
  }

  .detail-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 30px;
  }

  .detail-container {
    width: 100%;
  }

  .detail-title {
    margin: 0 0 45px;
    text-align: center;
    font-size: 40px;
  }

  .basic-info {
    margin-bottom: 45px;
  }

  .castle-heading {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 25px;
  }

  .castle-id {
    font-size: 18px;
    font-weight: bold;
  }

  .castle-name {
    font-size: 30px;
    font-weight: bold;
  }

  .basic-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 28px;
    margin-top: 15px;
    font-size: 17px;
  }

  .data-label {
    padding: 2px 6px;
    background-color: #eeeeee;
    font-weight: bold;
  }

  .detail-section {
    margin-top: 40px;
  }

  .detail-section h2 {
    margin-bottom: 20px;
    padding-bottom: 7px;
    border-bottom: 1px solid #cccccc;
    font-size: 22px;
  }

  .detail-row {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    padding: 9px 0;
    line-height: 1.6;
  }

  .detail-row .label {
    font-weight: bold;
  }

  .map-link-area {
    margin-top: 45px;
    text-align: center;
  }

.detail-navigation {
  margin-top: 30px;
  text-align: center;
}

.back-result-link {
  color: #0066cc;
  font-size: 16px;
}

.detail-note {
  margin-top: 50px;
  padding-top: 20px;
  border-top: 1px solid #cccccc;
  font-size: 14px;
  line-height: 1.8;
}

.detail-note h3 {
  margin: 0 0 12px;
  font-size: 16px;
}

.detail-note p {
  margin: 0 0 10px;
}

  .map-link {
    display: inline-block;
    padding: 12px 30px;
    border: 2px solid #333333;
    border-radius: 10px;
    background-color: #bfe7f6;
    color: #222222;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
  }

  .map-link:hover {
    background-color: #a8dced;
  }

  .back-button-area {
    margin-top: 50px;
    text-align: center;
  }

  .back-button-area a {
    color: #0066cc;
    font-size: 16px;
  }

  .back-separator {
    margin: 0 10px;
    color: #999999;
  }

  @media (max-width: 600px) {
    .detail-page {
      padding: 35px 20px;
    }

    .detail-title {
      font-size: 30px;
    }

    .castle-name {
      font-size: 25px;
    }

    .detail-row {
      grid-template-columns: 1fr;
      gap: 3px;
    }
  }
</style>

</head>

<body>

  <main class="detail-page">

    <section class="detail-container">

      <h1 class="detail-title">城館データ</h1>

      <div id="detail"></div>

      <div class="back-button-area">
        <a href="./search.html">検索画面にもどる</a>
        <span class="back-separator">｜</span>
        <a href="./start.html#select">検索の選択にもどる</a>
      </div>

    </section>

  </main>

  <script src="./js/detail.js"></script>

</body>

</html>
